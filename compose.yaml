# Local development only. Ports bind to 127.0.0.1 so the dev password never faces the network.
name: farolar

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: farolar
      POSTGRES_PASSWORD: farolar
      POSTGRES_DB: farolar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under a versioned subfolder, so mount the parent.
      - postgres-data:/var/lib/postgresql
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farolar -d farolar"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    cpus: 0.5
    # Above maxmemory: an AOF rewrite forks the process and needs headroom.
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  redis-data:
